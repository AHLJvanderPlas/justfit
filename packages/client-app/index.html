<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>JustFit.cc — Consistency over Intensity</title>
    <meta name="description" content="A privacy-first fitness app that adapts to your real life. Daily check-in. Smart plan. Just show up." />

    <!-- Fonts — loaded here (not from App.jsx) so the CSS fetch runs in parallel
         with the JS bundle instead of waiting for React to mount -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      id="jf-fonts"
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />

    <!-- iOS home-screen icon (must be before manifest) -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />

    <!-- PWA manifest -->
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Theme / status bar -->
    <meta name="theme-color" content="#020617" />
    <script>
      // Resolve the theme before the bundle loads, or the page paints dark for a
      // beat and then flips. Mirrors THEMES/resolveTheme in src/tokens.js — keep
      // the two palettes in step (smoke asserts the --bg values match).
      (function () {
        try {
          var m = localStorage.getItem("jf_theme") || "system";
          var light = m === "light" || (m === "system" &&
            window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches);
          var t = light
            ? { "--bg": "#f7f8fa", "--text": "#0f172a", "--muted": "#5b6675", "--subtle": "#94a3b8", "--overlay-rgb": "0,0,0" }
            : { "--bg": "#020617", "--text": "#f8fafc", "--muted": "#64748b", "--subtle": "#334155", "--overlay-rgb": "255,255,255" };
          for (var k in t) document.documentElement.style.setProperty(k, t[k]);
          document.documentElement.style.colorScheme = light ? "light" : "dark";
          document.documentElement.dataset.theme = light ? "light" : "dark";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", t["--bg"]);
        } catch (e) { /* storage blocked — dark stays */ }
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="JustFit" />

    <!-- Windows tile -->
    <meta name="msapplication-TileColor" content="#020617" />
    <meta name="msapplication-TileImage" content="/icons/mstile-150x150.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script src="/register-sw.js" defer></script>
  </body>
</html>
