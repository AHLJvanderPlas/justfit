name = "justfit-ops"
main = "src/index.js"
compatibility_date = "2026-08-01"

# 0 2 * * SUN — weekly D1 backup (Sunday 02:00 UTC)
# 0 7 * * *   — daily push-notification dispatch (07:00 UTC)
[triggers]
crons = ["0 2 * * SUN", "0 7 * * *"]

[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "justfit-db-backups-eu"
jurisdiction = "eu"

[[d1_databases]]
binding = "DB"
database_name = "justfit-db"
database_id = "4c6fedf0-b9e2-4441-aa98-71c1420136c1"

[vars]
APP_ORIGIN = "https://app.justfit.cc"
ALERT_EMAIL = "alexander@justfit.cc"

# Secrets (set via `wrangler secret put`):
#   PUSH_DISPATCH_SECRET — must match the justfit-app Pages env value
#   RESEND_API_KEY       — failure alerts to ALERT_EMAIL
